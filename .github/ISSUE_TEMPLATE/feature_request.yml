name: ✨ Feature request
description: Suggest an idea to make Talentia better
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need, not just the solution.
      placeholder: Recruiters keep asking me for a one-page version of my resume and I have to rebuild it by hand.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: A toggle to generate a condensed one-page version automatically.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: dropdown
    id: willing
    attributes:
      label: Would you like to implement it?
      options:
        - 'Yes, I can open a pull request'
        - 'Maybe, with some guidance'
        - 'No, just suggesting the idea'
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works without an AI key (local/offline feature)
        - label: This requires an AI call
        - label: This changes the database schema
